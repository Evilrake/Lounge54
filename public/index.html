<!doctype html>
<html lang="ru">
  <head>
    <meta charset="UTF-8" />
    <script>
      try {
        var theme = localStorage.getItem("lounge54-theme");
        document.documentElement.dataset.theme = theme === "light" ? "light" : "dark";
      } catch (e) {
        document.documentElement.dataset.theme = "dark";
      }
    </script>
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="Lounge54 — витрина кальянов и комплектующих. Покупка, кейтеринг и аренда через Telegram." />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@600;700&family=Manrope:wght@400;500;600;700&display=swap" rel="stylesheet" />
    <link rel="stylesheet" href="/css/styles.css" />
    <link rel="stylesheet" href="/css/extra.css" />
    <title>Lounge54 — кальяны и комплектующие</title>
  </head>
  <body>
    <div id="age"></div>
    <div class="app-shell">
      <header class="site-header" id="header"></header>
      <main id="app"></main>
      <footer class="site-footer" id="footer"></footer>
    </div>
    <script src="/js/app.js"></script>
  </body>
</html>
